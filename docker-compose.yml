services:
  postgres:
    image: postgres:17-alpine
    container_name: csewiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csewiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csewiki_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-csewiki}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-csewiki} -d $${POSTGRES_DB:-csewiki}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
